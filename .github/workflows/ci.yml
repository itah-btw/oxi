name: ci
on:
  push:
  pull_request:
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pasang shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: shellcheck
        run: shellcheck -S info oxi install.sh bin/*
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [archlinux:latest, fedora:latest]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan user + sudo
        shell: bash
        run: |
          if command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm --needed sudo shadow
          else
            dnf install -y sudo shadow-utils
          fi
          useradd -m -s /bin/bash tester
          mkdir -p /etc/sudoers.d
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
          chmod 0440 /etc/sudoers.d/tester
      - name: Jalankan installer (nyata)
        shell: bash
        run: |
          sudo -H -u tester env OXWM_YES=1 OXWM_NO_UPDATE=1 bash "$GITHUB_WORKSPACE/oxi"
      - name: Tampilkan log installer
        if: failure()
        shell: bash
        run: cat /var/log/oxi/install.log 2>/dev/null || true
