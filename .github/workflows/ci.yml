name: ci
on:
  push:
  pull_request:
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pasang shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: shellcheck
        run: shellcheck -S warning install.sh bin/* tests/*.sh
      - name: Uji asap
        run: bash tests/smoke.sh
